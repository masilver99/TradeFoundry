services:
  tradefoundry:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__DataDirectory: /app/data
      DataProtection__KeysDirectory: /app/data/keys
      Mcp__Enabled: "false"
      Backup__DefaultFolder: /app/backups
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
