services:
  tradefoundry:
    image: git.shaa.one/masilver/tradefoundry:${TRADEFOUNDRY_VERSION:-main}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__DataDirectory: /app/data
      DataProtection__KeysDirectory: /app/data/keys
      Mcp__Enabled: "false"
    volumes:
      - tradefoundry-data:/app/data
    restart: unless-stopped

volumes:
  tradefoundry-data:
