name: Windows installer

# Builds TradeFoundry-Setup.exe on the Linux runner (Inno Setup runs under Wine in Docker).
# Only release tags build automatically; branch pushes don't, because development installers
# never offer updates and would just repeat the slow Wine build on every push.
#  - Manual run (Run workflow): a development build of the chosen branch, kept as a workflow
#    artifact only. Use it to try an installer before tagging.
#  - Tags vX.Y.Z / vX.Y.Z-rc.N: the installer is also uploaded to this owner's public
#    "tradefoundry-windows" generic package. Stable tags additionally replace
#    tradefoundry-windows/latest/latest.json, which installed tray helpers check for updates.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: tradefoundry-windows-installer
  cancel-in-progress: false

jobs:
  build-windows-installer:
    runs-on: docker
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build installer
        id: build
        shell: bash
        env:
          BUILD_REF: ${{ forgejo.ref }}
          BUILD_SHA: ${{ forgejo.sha }}
          SERVER_URL: ${{ forgejo.server_url }}
          OWNER: ${{ forgejo.repository_owner }}
        run: |
          set -Eeuo pipefail

          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            version="${BUILD_REF#refs/tags/v}"
            # Same tag rules as the container workflow.
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
              echo 'Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N (alpha/beta also supported).'
              exit 1
            fi
          else
            version="0.0.0-dev.${BUILD_SHA:0:12}"
          fi

          package_url="${SERVER_URL%/}/api/packages/${OWNER}/generic/tradefoundry-windows"
          manifest_url="${package_url}/latest/latest.json"
          image="tradefoundry-windows-installer:${BUILD_SHA}"

          docker build --pull --file installer/Dockerfile --target artifact \
            --build-arg "VERSION=$version" \
            --build-arg "REVISION=$BUILD_SHA" \
            --build-arg "UPDATE_MANIFEST_URL=$manifest_url" \
            --tag "$image" .

          mkdir -p artifacts/windows/installer
          installer="artifacts/windows/installer/TradeFoundry-Setup-${version}.exe"
          container="$(docker create "$image" noop)"
          docker cp "$container:/TradeFoundry-Setup.exe" "$installer"
          docker rm "$container" > /dev/null
          docker image rm "$image" > /dev/null

          sha256="$(sha256sum "$installer" | cut -d' ' -f1)"
          size="$(stat -c %s "$installer")"
          echo "$sha256  $(basename "$installer")" > "$installer.sha256"
          echo "Built $installer ($size bytes, sha256 $sha256)"

          {
            echo "version=$version"
            echo "installer=$installer"
            echo "sha256=$sha256"
            echo "size=$size"
            echo "package_url=$package_url"
          } >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v3.2.2-node20
        with:
          name: TradeFoundry-Windows-Installer-${{ steps.build.outputs.version }}
          path: artifacts/windows/installer/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release to package registry
        if: startsWith(forgejo.ref, 'refs/tags/v')
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          INSTALLER: ${{ steps.build.outputs.installer }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          SIZE: ${{ steps.build.outputs.size }}
          PACKAGE_URL: ${{ steps.build.outputs.package_url }}
        run: |
          set -Eeuo pipefail
          test -n "$REGISTRY_USERNAME" || { echo 'Missing REGISTRY_USERNAME secret'; exit 1; }
          test -n "$REGISTRY_TOKEN" || { echo 'Missing REGISTRY_TOKEN secret (needs write:package)'; exit 1; }
          command -v curl > /dev/null || { apt-get update -qq && apt-get install -y -qq curl > /dev/null; }

          auth="$REGISTRY_USERNAME:$REGISTRY_TOKEN"
          file_name="$(basename "$INSTALLER")"
          installer_url="$PACKAGE_URL/$VERSION/$file_name"

          echo "Uploading $installer_url"
          curl --fail-with-body --silent --show-error --user "$auth" \
            --upload-file "$INSTALLER" "$installer_url"
          curl --fail-with-body --silent --show-error --user "$auth" \
            --upload-file "$INSTALLER.sha256" "$installer_url.sha256"

          if [[ "$VERSION" == *-* ]]; then
            echo "Prerelease $VERSION uploaded; latest.json is unchanged, so trays are not offered it."
            exit 0
          fi

          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "version": "%s",\n  "installerUrl": "%s",\n  "sha256": "%s",\n  "size": %s,\n  "publishedAt": "%s"\n}\n' \
            "$VERSION" "$installer_url" "$SHA256" "$SIZE" "$published_at" > latest.json
          cat latest.json

          # Generic package files cannot be overwritten, so replace latest.json (404 = first release).
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$auth" \
            --request DELETE "$PACKAGE_URL/latest/latest.json")"
          if [[ "$status" != 204 && "$status" != 404 ]]; then
            echo "Could not remove the previous latest.json (HTTP $status)"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --user "$auth" \
            --upload-file latest.json "$PACKAGE_URL/latest/latest.json"
          echo "Published $VERSION as the latest Windows release."

      # Records each public stable release as a Forgejo release. The repository's Gotify webhook
      # listens for Release events, so this is what sends the phone notification. Prereleases get
      # no Forgejo release, so they stay quiet.
      #
      # The annotated tag's message becomes the changelog. The installer is public by this point and
      # a re-run cannot upload it again, so a missing or unreadable message only warns.
      - name: Create Forgejo release
        if: startsWith(forgejo.ref, 'refs/tags/v') && !contains(forgejo.ref, '-')
        shell: bash
        env:
          API_URL: ${{ forgejo.server_url }}/api/v1
          REPOSITORY: ${{ forgejo.repository }}
          TOKEN: ${{ forgejo.token }}
          TAG: ${{ forgejo.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
          INSTALLER: ${{ steps.build.outputs.installer }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          PACKAGE_URL: ${{ steps.build.outputs.package_url }}
        run: |
          set -Eeuo pipefail
          missing=()
          command -v curl > /dev/null || missing+=(curl)
          command -v jq > /dev/null || missing+=(jq)
          if (( ${#missing[@]} )); then
            apt-get update -qq && apt-get install -y -qq "${missing[@]}" > /dev/null
          fi

          repo_api="${API_URL%/}/repos/$REPOSITORY"
          api_get() {
            curl --fail --silent --show-error --retry 3 --max-time 30 \
              --header "Authorization: token $TOKEN" "$repo_api/$1"
          }

          # Prints nothing for a lightweight tag. The refs API matches by prefix (v0.2.1 also returns
          # v0.2.10), so the exact ref is selected.
          read_tag_message() {
            local refs sha tag_object
            refs="$(api_get "git/refs/tags/$TAG")" || return 1
            sha="$(jq -r --arg ref "refs/tags/$TAG" \
              '[.] | flatten[] | select(.ref == $ref and .object.type == "tag") | .object.sha' <<< "$refs")" || return 1
            [[ -n "$sha" ]] || return 0
            tag_object="$(api_get "git/tags/$sha")" || return 1
            jq -r '.message // ""' <<< "$tag_object"
          }

          # Drops the "TradeFoundry X.Y.Z: summary" title (using the summary if nothing follows it),
          # trailers and signatures. Joins wrapped lines, because Forgejo shows each newline in
          # release notes as a line break.
          format_changelog() {
            awk -v title="TradeFoundry $VERSION" '
              function emit(line) {
                if (printed && gap) print ""
                print line; printed = 1; gap = 0
              }
              function flush() {
                if (text != "") emit(text)
                text = ""
              }
              { sub(/\r$/, "") }
              NR == 1 && $0 == title { next }
              NR == 1 && index($0, title ":") == 1 {
                summary = substr($0, length(title) + 2); sub(/^[ \t]+/, "", summary)
                next
              }
              /^[ \t]*(```|~~~)/ { flush(); emit($0); code = !code; next }
              code { print; next }
              /^-----BEGIN (PGP|SSH) SIGNATURE-----/ { exit }
              tolower($0) ~ /^(co-authored-by|signed-off-by):/ { next }
              /^[ \t]*$/ { flush(); gap = 1; next }
              /^[ \t]*([-*+]|[0-9]+[.)])[ \t]/ { flush(); text = $0; next }
              /^[ \t]*(#+([ \t]|$)|[|>]|---+$)/ { flush(); emit($0); next }
              text == "" && /^(    |\t)/ { emit($0); next }
              {
                if (text == "") { text = $0; next }
                sub(/^[ \t]+/, "")
                text = text " " $0
              }
              END {
                flush()
                if (!printed && summary != "") print toupper(substr(summary, 1, 1)) substr(summary, 2)
              }'
          }

          changelog=''
          if tag_message="$(read_tag_message)" && changelog="$(format_changelog <<< "$tag_message")"; then
            if [[ -z "$changelog" ]]; then
              echo "::warning::$TAG has no annotated tag message to use; creating its release without a changelog."
            fi
          else
            changelog=''
            echo "::warning::Could not read the message of $TAG; creating its release without a changelog."
          fi

          installer_url="$PACKAGE_URL/$VERSION/$(basename "$INSTALLER")"
          body="$(printf '%s\n' \
            "TradeFoundry $VERSION for Windows. Installed tray helpers are now offered this update." \
            '' \
            "- Installer: [$(basename "$INSTALLER")]($installer_url)" \
            "- SHA-256: \`$SHA256\`")"
          if [[ -n "$changelog" ]]; then
            body+=$'\n\n## Changelog\n\n'"$changelog"
          fi

          status="$(jq -n --arg tag "$TAG" --arg name "TradeFoundry $VERSION" --arg body "$body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}' \
            | curl --silent --show-error --output response.json --write-out '%{http_code}' \
                --header "Authorization: token $TOKEN" \
                --header 'Content-Type: application/json' \
                --data-binary @- "$repo_api/releases")"
          case "$status" in
            201) echo "Created Forgejo release $TAG." ;;
            409) echo "A Forgejo release for $TAG already exists (re-run); leaving it as is." ;;
            *) echo "Could not create the Forgejo release (HTTP $status):"; cat response.json; exit 1 ;;
          esac
